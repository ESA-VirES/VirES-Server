{% load socialaccount %}
{% get_providers as socialaccount_providers %}
{% for provider in socialaccount_providers %}
{% if provider.id == "openid" %}
{% for brand in provider.get_brands %}
<li>
  <form method="post" action="{% provider_login_url provider.id openid=brand.openid_url process=process %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary btn-block btn-lg socialaccount_provider_button {{provider.id}} {{brand.id}}" title="{{brand.name}}">
        {% if process == "connect" %}Connect {{brand.name}} account{% else %}Sign in with {{brand.name}}{% endif %}
    </button>
  </form>
</li>
{% endfor %}
{% endif %}
<li>
  <form method="post" action="{% provider_login_url provider.id process=process scope=scope auth_params=auth_params %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary btn-block btn-lg socialaccount_provider_button {{provider.id}} {{provider.id}}" title="{{provider.name}}">
        {% if process == "connect" %}Connect {{provider.name}} account{% else %}Sign in with {{provider.name}}{% endif %}
    </button>
  </form>
</li>
{% endfor %}
